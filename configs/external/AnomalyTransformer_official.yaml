experiment:
  name: AnomalyTransformer_official
method:
  name: anomaly_transformer_official
data:
  channels: 6
  max_len: 48000
  exts: [.npy]
  recursive: true
  transpose_if_tall: true
  strict_checks: true
  npy_mmap_mode: null
  normalize: zscore
  robust_norm_seed: 2025
  norm_max_samples: null
model:
  channels: 6
nrem:
  window_size: 64
  stride: 32
  score_mode: anomaly_transformer_official
baseline:
  hidden_dim: 32
  heads: 4
  layers: 1
  lambda_assoc: 0.1
  score_aggregation: mean
train:
  epochs: 30
  batch_size: 2
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0
  grad_clip: 5.0
  use_ema: false
runtime:
  cudnn_benchmark: true
  allow_tf32: true
