[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrem"
version = "0.1.0"
description = "Nested Residual Evidence Modeling for sample-level anomaly detection under contaminated training"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Zikai Li"},
  {name = "Jianfeng Xu"},
  {name = "Long Bai"},
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["nrem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
